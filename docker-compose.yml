
services:
  postgres:
    image: postgres:15-alpine
    container_name: reserva_db
    environment:
      POSTGRES_USER: reserva_user
      POSTGRES_PASSWORD: reserva_password
      POSTGRES_DB: reserva_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the schema script to initialize the DB automatically
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserva_user -d reserva_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reserva_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
